<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="一只鹈鹕快乐地骑着自行车">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC4EF"/>
      <stop offset="1" stop-color="#E6F6FF"/>
    </linearGradient>
    <radialGradient id="sunCore">
      <stop offset="0" stop-color="#FFF7CF"/>
      <stop offset="1" stop-color="#FFD25E"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#FFE9A0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6EDC9"/>
      <stop offset="1" stop-color="#B6DEA9"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2E2B3"/>
      <stop offset="1" stop-color="#9FCF90"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#767F8B"/>
      <stop offset="1" stop-color="#454E59"/>
    </linearGradient>
    <linearGradient id="frameG" gradientUnits="userSpaceOnUse" x1="0" y1="310" x2="0" y2="470">
      <stop offset="0" stop-color="#FF6F60"/>
      <stop offset="1" stop-color="#C92F2A"/>
    </linearGradient>
    <radialGradient id="bodyG" cx="0.38" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E5D6"/>
    </radialGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2DECE"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC46A"/>
      <stop offset="1" stop-color="#F0952E"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9AE4E"/>
      <stop offset="1" stop-color="#E8801F"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3A4A63" flood-opacity="0.25"/>
    </filter>

    <!-- 车轮（辐条旋转） -->
    <g id="wheelDef">
      <circle r="84" fill="none" stroke="#333A45" stroke-width="12"/>
      <circle r="72" fill="none" stroke="#DDE3EA" stroke-width="5"/>
      <g stroke="#C6CEDA" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="0" y1="-72" x2="0" y2="72"/>
        <line x1="-51" y1="-51" x2="51" y2="51"/>
        <line x1="-51" y1="51" x2="51" y2="-51"/>
        <line x1="-67.5" y1="-27.9" x2="67.5" y2="27.9"/>
        <line x1="-67.5" y1="27.9" x2="67.5" y2="-27.9"/>
        <line x1="-27.9" y1="-67.5" x2="27.9" y2="67.5"/>
        <line x1="-27.9" y1="67.5" x2="27.9" y2="-67.5"/>
      </g>
      <circle r="9" fill="#9AA3B0" stroke="#5B6472" stroke-width="2"/>
      <circle r="3.5" fill="#E8ECF2"/>
    </g>

    <!-- 云朵 -->
    <g id="cloud" fill="#FFFFFF">
      <ellipse cx="0" cy="0" rx="46" ry="19"/>
      <ellipse cx="-30" cy="7" rx="28" ry="14"/>
      <ellipse cx="30" cy="7" rx="26" ry="13"/>
    </g>
  </defs>

  <!-- ======== 背景 ======== -->
  <rect width="900" height="620" fill="url(#sky)"/>
  <circle cx="795" cy="92" r="105" fill="url(#sunGlow)"/>
  <circle cx="795" cy="92" r="40" fill="url(#sunCore)"/>

  <path d="M 585 92 c 6 -7 12 -7 18 0 c 6 -7 12 -7 18 0" fill="none" stroke="#6E9CC4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 655 64 c 4 -5 9 -5 13 0 c 4 -5 9 -5 13 0" fill="none" stroke="#6E9CC4" stroke-width="2" stroke-linecap="round"/>

  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0; 24 0; 0 0" dur="16s" repeatCount="indefinite"/>
    <use xlink:href="#cloud" href="#cloud" x="150" y="105"/>
  </g>
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" dur="20s" repeatCount="indefinite"/>
    <g transform="translate(430,66) scale(0.78)"><use xlink:href="#cloud" href="#cloud"/></g>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; 16 0; 0 0" dur="13s" repeatCount="indefinite"/>
    <g transform="translate(660,148) scale(0.6)"><use xlink:href="#cloud" href="#cloud"/></g>
  </g>

  <!-- 远山与树 -->
  <ellipse cx="170" cy="560" rx="280" ry="100" fill="url(#hillA)"/>
  <ellipse cx="450" cy="555" rx="200" ry="62" fill="#CDE7C0" opacity="0.9"/>
  <ellipse cx="700" cy="570" rx="320" ry="120" fill="url(#hillB)"/>
  <g>
    <rect x="71" y="498" width="9" height="48" rx="3" fill="#8A6A4F"/>
    <circle cx="76" cy="486" r="24" fill="#85C07A"/>
    <circle cx="60" cy="499" r="15" fill="#95CB88"/>
    <circle cx="92" cy="499" r="15" fill="#7AB56E"/>
  </g>
  <g>
    <rect x="842" y="505" width="9" height="42" rx="3" fill="#8A6A4F"/>
    <circle cx="846" cy="492" r="21" fill="#85C07A"/>
    <circle cx="831" cy="503" r="13" fill="#95CB88"/>
    <circle cx="861" cy="503" r="13" fill="#7AB56E"/>
  </g>

  <!-- 公路 -->
  <rect x="0" y="545" width="900" height="75" fill="url(#roadG)"/>
  <line x1="0" y1="546" x2="900" y2="546" stroke="#93A0AC" stroke-width="3" opacity="0.8"/>
  <path d="M -60 585 H 960" stroke="#F2EDE0" stroke-width="6" stroke-dasharray="42 30" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="72" dur="0.55s" repeatCount="indefinite"/>
  </path>

  <!-- 速度线与尘土 -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="462" x2="140" y2="462" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="38" y1="492" x2="128" y2="492" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="1s" begin="-0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="66" y1="522" x2="152" y2="522" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="1s" begin="-0.6s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#CFE3EE">
    <circle cx="158" cy="546" r="8" opacity="0.4">
      <animate attributeName="opacity" values="0;0.55;0" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="134" cy="552" r="5.5" opacity="0.3">
      <animate attributeName="opacity" values="0;0.45;0" dur="1.3s" begin="-0.45s" repeatCount="indefinite"/>
    </circle>
  </g>

  <ellipse cx="388" cy="557" rx="245" ry="13" fill="#2F353D" opacity="0.28"/>

  <!-- ======== 自行车 + 鹈鹕（整体轻微起伏） ======== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 2.5; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="1.15s" repeatCount="indefinite"/>

    <!-- 车轮 -->
    <use xlink:href="#wheelDef" href="#wheelDef" x="205" y="460"/>
    <use xlink:href="#wheelDef" href="#wheelDef" x="565" y="460"/>

    <!-- 传动（远侧）：链条、飞轮、牙盘、曲柄与远踏板 -->
    <path d="M 375 439 L 205 451" stroke="#77808E" stroke-width="4" stroke-dasharray="6 3" fill="none">
      <animate attributeName="stroke-dashoffset" from="0" to="9" dur="0.18s" repeatCount="indefinite"/>
    </path>
    <path d="M 375 485 L 205 469" stroke="#77808E" stroke-width="4" stroke-dasharray="6 3" fill="none">
      <animate attributeName="stroke-dashoffset" from="0" to="-9" dur="0.18s" repeatCount="indefinite"/>
    </path>
    <circle cx="205" cy="460" r="10" fill="none" stroke="#77808E" stroke-width="4"/>
    <circle cx="375" cy="462" r="23" fill="none" stroke="#828B99" stroke-width="7" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate" from="0 375 462" to="360 375 462" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="375" cy="462" r="6" fill="#828B99"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 375 462" to="360 375 462" dur="1.6s" repeatCount="indefinite"/>
      <line x1="375" y1="462" x2="329" y2="462" stroke="#454B54" stroke-width="7" stroke-linecap="round"/>
      <rect x="314" y="457" width="30" height="10" rx="3.5" fill="#262B32"/>
    </g>

    <!-- 远侧腿（踩踏动画，相位与近侧腿相差 180°） -->
    <path d="M 310 298 C 350.2 332.7 385.9 363.5 399.3 375 C 381.7 396.8 343.1 444.6 329 462"
          fill="none" stroke="#D9862B" stroke-width="10" stroke-linecap="round">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
        M 310 298 C 350.2 332.7 385.9 363.5 399.3 375 C 381.7 396.8 343.1 444.6 329 462;
        M 310 298 C 355.9 324.7 396.6 348.5 411.9 357.4 C 392.7 377.8 350.5 422.7 335.2 439;
        M 310 298 C 360.4 314.6 405.3 329.4 422.1 334.9 C 404.6 356.7 366 404.7 352 422.2;
        M 310 298 C 362.4 306.4 409 313.8 426.5 316.6 C 413.6 341.5 385.3 396.1 375 416;
        M 310 298 C 362.6 305.2 409.4 311.6 426.9 314 C 419.7 341.1 403.8 400.6 398 422.2;
        M 310 298 C 361.4 311.2 407.2 323 424.3 327.4 C 421.9 355.3 416.7 416.7 414.8 439;
        M 310 298 C 357.7 321.4 400 342.3 415.9 350.1 C 417.2 378.1 420 439.6 421 462;
        M 310 298 C 350.6 332.2 386.8 362.5 400.3 373.9 C 403.9 401.7 411.9 462.8 414.8 485;
        M 310 298 C 342.8 339.8 372 376.9 382.9 390.8 C 386.7 418.6 395 479.6 398 501.8;
        M 310 298 C 339.6 342.1 365.8 381.3 375.7 396 C 375.5 424 375.1 485.6 375 508;
        M 310 298 C 341.3 340.9 369.2 379 379.6 393.3 C 372.7 420.4 357.5 480.1 352 501.8;
        M 310 298 C 345.2 337.7 376.5 373.1 388.2 386.3 C 374.9 411 345.8 465.3 335.2 485;
        M 310 298 C 350.2 332.7 385.9 363.5 399.3 375 C 381.7 396.8 343.1 444.6 329 462"/>
    </path>
    <path d="M 317 454 L 344 451 L 350 460 L 320 464 Z" fill="#D9862B">
      <animateTransform attributeName="transform" type="translate" values="0 0; 6.2 -23; 23 -39.8; 46 -46; 69 -39.8; 85.8 -23; 92 0; 85.8 23; 69 39.8; 46 46; 23 39.8; 6.2 23; 0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- 车架 -->
    <g stroke="url(#frameG)" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M 375 462 L 205 460"/>
      <path d="M 205 460 L 332 332"/>
      <path d="M 375 462 L 332 332"/>
      <path d="M 332 332 L 540 322"/>
      <path d="M 540 336 L 375 462"/>
    </g>
    <line x1="536" y1="314" x2="548" y2="350" stroke="url(#frameG)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 548 350 C 556 380 562 420 565 460" fill="none" stroke="url(#frameG)" stroke-width="8" stroke-linecap="round"/>

    <!-- 车座 -->
    <line x1="332" y1="332" x2="327" y2="307" stroke="#727B87" stroke-width="7"/>
    <ellipse cx="322" cy="301" rx="33" ry="8.5" fill="#363B44"/>

    <!-- 车把与车铃 -->
    <path d="M 536 314 L 533 293 C 530 284 517 281 506 286" fill="none" stroke="#3A3F47" stroke-width="8" stroke-linecap="round"/>
    <line x1="507" y1="285" x2="497" y2="288" stroke="#2A2F37" stroke-width="11" stroke-linecap="round"/>
    <circle cx="526" cy="303" r="5.5" fill="#F6C445" stroke="#C99B2E" stroke-width="1.5"/>
    <circle cx="526" cy="303" r="1.5" fill="#C99B2E"/>

    <!-- 水壶 -->
    <g transform="rotate(-37.4 457.5 399)">
      <rect x="435.5" y="391" width="44" height="16" rx="7" fill="#86CDF2" stroke="#58A8D8" stroke-width="1.5"/>
      <circle cx="475" cy="399" r="3" fill="#58A8D8"/>
    </g>

    <!-- 近侧曲柄与踏板（旋转） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 375 462" to="360 375 462" dur="1.6s" repeatCount="indefinite"/>
      <line x1="375" y1="462" x2="421" y2="462" stroke="#454B54" stroke-width="7" stroke-linecap="round"/>
      <rect x="406" y="457" width="30" height="10" rx="3.5" fill="#2F343B"/>
      <circle cx="421" cy="462" r="2.5" fill="#FF8A5C"/>
    </g>

    <!-- ======== 鹈鹕 ======== -->
    <g filter="url(#soft)">
      <!-- 尾羽 -->
      <path d="M 254 236 L 208 210 L 222 232 L 200 238 L 226 250 L 216 264 L 252 258 Z"
            fill="#F6F3E9" stroke="#D9D3C0" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- 身体 -->
      <ellipse cx="302" cy="250" rx="66" ry="49" transform="rotate(-8 302 250)"
               fill="url(#bodyG)" stroke="#DCD6C4" stroke-width="1.5"/>
      <ellipse cx="296" cy="268" rx="50" ry="22" fill="#E3DECD" opacity="0.45"/>
      <!-- 颈（先阴影后主体） -->
      <path d="M 350 236 C 386 226 397 198 399 160" fill="none" stroke="#E6E1D1" stroke-width="33" stroke-linecap="round" transform="translate(0,3)"/>
      <path d="M 350 236 C 386 226 397 198 399 160" fill="none" stroke="#FBFAF4" stroke-width="33" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="404" cy="142" r="26" fill="#E8E3D3"/>
      <circle cx="400" cy="137" r="25.5" fill="#FDFCF7"/>
      <path d="M 382 118 C 375 108 376 99 383 93 C 384 102 389 108 393 113 Z"
            fill="#F2EEDF" stroke="#DCD6C4" stroke-width="1"/>
      <circle cx="408" cy="128" r="6.4" fill="#EFEAD9"/>
      <circle cx="408" cy="128" r="4.4" fill="#26262B"/>
      <circle cx="406.5" cy="126.5" r="1.5" fill="#FFFFFF"/>
      <!-- 喉囊 -->
      <path d="M 415 141 C 447 143 536 153 578 162 C 566 194 522 212 478 205 C 445 199 424 172 415 141 Z"
            fill="url(#pouchG)" stroke="#D97F1F" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 428 158 C 448 178 480 192 515 192" fill="none" stroke="#FFCF8F" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
      <!-- 上喙 -->
      <path d="M 413 121 C 468 126 538 140 585 155 C 591 157 593 162 588 166 C 584 169 578 168 573 166 C 522 156 462 145 413 141 Z"
            fill="url(#beakG)" stroke="#D97F1F" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 418 128 C 470 133 535 145 580 158" fill="none" stroke="#FFD79B" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
      <line x1="432" y1="128" x2="458" y2="132" stroke="#D98A2B" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
      <!-- 翅膀（扶把） -->
      <path d="M 326 220 C 392 228 458 250 502 278 C 510 284 509 292 501 295 L 468 291 C 416 284 366 266 332 248 C 320 242 318 227 326 220 Z"
            fill="url(#wingG)" stroke="#D9D3C0" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 344 236 C 400 246 452 262 490 282" fill="none" stroke="#DCD6C2" stroke-width="2" opacity="0.9"/>
      <path d="M 340 250 C 392 260 440 272 474 286" fill="none" stroke="#DCD6C2" stroke-width="2" opacity="0.7"/>
      <path d="M 462 278 C 480 284 496 290 505 295 C 501 302 490 303 480 299 L 466 292 C 458 287 456 281 462 278 Z"
            fill="#93A0AE" stroke="#7E8B99" stroke-width="1"/>
      <path d="M 474 291 L 480 299 M 487 295 L 491 301" stroke="#7E8B99" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 近侧腿（踩踏动画） -->
      <path d="M 318 294 C 364.8 319.2 406.3 341.6 421.9 350 C 421.7 378 421.2 439.6 421 462"
            fill="none" stroke="#F2A23D" stroke-width="11" stroke-linecap="round">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
          M 318 294 C 364.8 319.2 406.3 341.6 421.9 350 C 421.7 378 421.2 439.6 421 462;
          M 318 294 C 357.3 329.7 392.2 361.5 405.3 373.4 C 407.7 401.3 412.9 462.7 414.8 485;
          M 318 294 C 348.6 337.4 375.8 375.9 386 390.4 C 389 418.3 395.6 479.5 398 501.8;
          M 318 294 C 344.7 339.9 368.5 380.7 377.4 396 C 376.8 424 375.5 485.6 375 508;
          M 318 294 C 346.4 338.9 371.7 378.7 381.2 393.7 C 373.9 420.7 357.8 480.2 352 501.8;
          M 318 294 C 350.4 336 379.3 373.4 390.1 387.4 C 376.4 411.8 346.2 465.5 335.2 485;
          M 318 294 C 355.8 331.4 389.3 364.6 401.9 377 C 383.7 398.3 343.6 445 329 462;
          M 318 294 C 361.8 324 400.7 350.7 415.3 360.7 C 395.3 380.3 351.2 423.3 335.2 439;
          M 318 294 C 367.1 314.3 410.7 332.3 427.1 339.1 C 408.3 359.9 367 405.6 352 422.2;
          M 318 294 C 369.8 305.8 415.8 316.3 433.1 320.2 C 418.6 344.2 386.6 396.8 375 416;
          M 318 294 C 370.2 303.9 416.5 312.8 433.9 316.1 C 424.9 342.6 405.2 401 398 422.2;
          M 318 294 C 368.8 309.4 414 323.1 430.9 328.2 C 426.9 355.9 418 416.8 414.8 439;
          M 318 294 C 364.8 319.2 406.3 341.6 421.9 350 C 421.7 378 421.2 439.6 421 462"/>
      </path>
      <g stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0; -6.2 23; -23 39.8; -46 46; -69 39.8; -85.8 23; -92 0; -85.8 -23; -69 -39.8; -46 -46; -23 -39.8; -6.2 -23; 0 0" dur="1.6s" repeatCount="indefinite"/>
        <path d="M 405 455 L 436 452 L 444 462 L 431 467 L 407 466 Z"
              fill="#F2A23D" stroke="#D9862B" stroke-width="1"/>
        <path d="M 417 456 L 418 466 M 427 455 L 429 465" stroke="#D9862B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>
